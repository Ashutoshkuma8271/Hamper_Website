<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A_S Hamper — Personalised Artisan Gift Hampers, Hand-Packed</title>
    <meta name="description" content="Explore custom luxury gift hampers for birthdays, anniversaries, weddings, corporate events & festivals. Hand-packed with love and delivered across India." />
    
    <!-- Open Graph & Meta -->
    <meta property="og:title" content="A_S Hamper — Personalised Artisan Gift Hampers" />
    <meta property="og:description" content="Choose a basket, fill it with handpicked luxury items, add custom message notes & photo keepsakes." />
    <meta property="og:image" content="https://images.pexels.com/photos/11112057/pexels-photo-11112057.jpeg?auto=compress&cs=tinysrgb&h=650&w=940" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Agentic Browsing & WebMCP Discovery Standards -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="LLM Summary" />
    <meta name="ai-agent" content="enabled" />
    <meta name="webmcp" content="v1" />

    <!-- Schema.org Structured Data for AI Agents & Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "A_S Hamper",
        "url": "https://ashutoshgifthamper.netlify.app",
        "description": "Personalised artisan gift hampers hand-packed for birthdays, anniversaries, corporate events, and weddings.",
        "telephone": "+916386256770",
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://wa.me/916386256770"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "A_S Hamper",
        "url": "https://ashutoshgifthamper.netlify.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://ashutoshgifthamper.netlify.app/best-sellers?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Critical Image Preload for Mobile LCP Optimization -->
    <link rel="preload" as="image" href="/hero-hamper.webp" type="image/webp" fetchpriority="high" />

    <!-- CDN Preconnects & DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.pexels.com" />

    <!-- Non-Render-Blocking Google Fonts (Eliminates FCP render delay on mobile) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body className="bg-cream-50 text-ink-700 antialiased selection:bg-wine-600 selection:text-cream-50 dark:bg-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
